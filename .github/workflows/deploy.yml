name: Deploy LaporJalan

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy ke VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/apps/jalanrusak_id

            # Pull latest code
            git pull origin main

            # ===== BACKEND =====
            cd /root/apps/jalanrusak_id/backend
            npm ci
            npx prisma generate
            npx prisma db push
            npm run build

            # ===== FRONTEND =====
            cd /root/apps/jalanrusak_id/frontend
            npm ci
            npm run build

            # ===== RESTART PM2 =====
            pm2 reload jalanrusak-frontend || pm2 start /root/apps/jalanrusak_id/ecosystem.config.js --only jalanrusak-frontend
            pm2 reload jalanrusak-backend  || pm2 start /root/apps/jalanrusak_id/ecosystem.config.js --only jalanrusak-backend

            pm2 save
            echo "✅ Deploy selesai!"